name: Build webhook image and push to Yandex Container Registry

# Собирает образ приёмника и кладёт его в реестр Yandex Cloud.
# Docker на машине разработчика не нужен — всё делает раннер GitHub.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   YC_REGISTRY_ID — идентификатор реестра, например crp1a2b3c4d5e6f7g8h9i
#   YC_SA_KEY      — JSON-ключ сервисного аккаунта с ролью
#                    container-registry.images.pusher (целиком, вместе со скобками)
#
# После успешной сборки в консоли Serverless Containers нажмите
# «Создать ревизию» и выберите новый тег образа.

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'deploy/Dockerfile'
      - '.github/workflows/deploy-webhook.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить, что секреты заданы
        env:
          REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
          SA_KEY: ${{ secrets.YC_SA_KEY }}
        run: |
          if [ -z "$REGISTRY_ID" ] || [ -z "$SA_KEY" ]; then
            echo "Не заданы секреты YC_REGISTRY_ID и/или YC_SA_KEY" >&2
            exit 1
          fi

      - name: Войти в Container Registry
        env:
          SA_KEY: ${{ secrets.YC_SA_KEY }}
        run: printf '%s' "$SA_KEY" | docker login --username json_key --password-stdin cr.yandex

      - name: Собрать и отправить образ
        env:
          REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
        run: |
          IMAGE="cr.yandex/$REGISTRY_ID/umskul-webhook"
          docker build -f deploy/Dockerfile -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          echo "Готово. Образ: $IMAGE:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
